# Override: swe-rex is not pre-installed in the stock SWE-bench images, so the
# sandbox falls back to `pipx run swe-rex`, which installs swe-rex + heavy deps
# in-sandbox at startup. That exceeds the bundled 600s startup_timeout (the
# server does come up, just late), so the local side times out. Raise the
# window. For scale, pre-bake swe-rex into the image instead of paying this
# per-sandbox install.
environment:
  startup_timeout: 1200.0
  deployment_timeout: 2400.0
  runtime_timeout: 2400.0
